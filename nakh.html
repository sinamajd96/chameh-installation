<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تو را خواب می‌دیدم - مریم ایلخان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ee;
      color: #1b1b1b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 36px 24px 60px;
    }

    .cover {
      display: block;
      width: 78%;
      max-width: 340px;
      margin: 0 auto 32px;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 25px;
      font-weight: 600;
      text-align: center;
    }

    .audio-wrapper {
      margin: 0 0 34px;
    }

    audio {
      width: 100%;
    }

    .description {
      font-size: 16px;
      text-align: right;
      color: #333;
    }

    .description p {
      margin: 0;
    }

    .footer {
      margin-top: 45px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="cover"
      src="cover.jpg"
      alt="جلد کتاب"
    >

    <h1>نخ سه هزار و شانزدهم

</h1>

    <div class="audio-wrapper">
      <audio controls preload="metadata">
        <source src="nakh.mp3" type="audio/mpeg">
        مرورگر شما امکان پخش فایل صوتی را ندارد.
      </audio>
    </div>

    <div class="description">
      <p>
لطفا کشوی اول را باز کنید و پس از شنیدن فایل صوتی آن‌را ببندید.

      </p>
    </div>

    <div class="footer">
      Chameh — Tehran, 2026
    </div>

  </main>

</body>
</html>
